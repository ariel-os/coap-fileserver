[package]
name = "coap-fileserver"
version = "0.0.1-alpha.0"
edition = "2024"
repository = "https://github.com/ariel-os/coap-fileserver"
license = "MIT OR Apache-2.0"
keywords = ["coap", "iot"]
categories = ["network-programming", "web-programming"]
description = "A simple CoAP file server"

[dependencies]
cap-std = "4.0.3"
clap = { version ="4", features = [ "derive" ] }
clap-verbosity-flag = "3"
coap-handler = "0.2.1"
coap-message = "0.3.7"
coap-message-utils = { version = "0.3.12", features = ["error_unprocessed_coap_option", "error_title"] }
coap-numbers = "0.2.11"
coapcore = "0.1.1"
crc = "3.4.0"
embedded-nal-async = "0.9.0"
embedded-nal-coap = "0.1.0-alpha.6"
log = "0.4"
pretty_env_logger = "0.5"
rand = { version = "0.9.0", features = ["thread_rng"] }
std-embedded-nal-async = "0.4.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }

[package.metadata.release]
sign-tag = true
